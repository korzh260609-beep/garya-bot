name: SG 2.1 CI

on:
  push:
    branches:
      - dev/sg2.1-semantic
  pull_request:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --package-lock-only
      - run: |
          echo 'BLOCK12_LOCK_BEGIN'
          cat package-lock.json
          echo 'BLOCK12_LOCK_END'
      - run: npm ci
      - run: npm run check
      - run: npm start
