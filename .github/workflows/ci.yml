name: SG 2.1 CI

on:
  pull_request:
    branches:
      - main

concurrency:
  group: sg21-ci-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sg
          POSTGRES_PASSWORD: sg
          POSTGRES_DB: sg_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sg -d sg_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://sg:sg@localhost:5432/sg_test
      DATABASE_SSL: "false"
      SG_PERSISTENCE_MODE: postgres
      SG_ENVIRONMENT: ci
      SG_REVISION: block-16.17
      SG_PROJECT_SCOPE: sg2.1
      SG_WORKER_VERIFY: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run migrate
      - name: Memory 2.0 unit tests
        run: node --test tests/memory2.test.js
      - name: Memory 2.0 PostgreSQL tests
        run: node --test tests/memory2Postgres.test.js
      - name: Memory 2.0 response context regression
        run: node --test tests/boundedResponseContext.test.js tests/runtimeComposition.test.js
      - name: Block 16.18 focused security test
        run: node --test tests/ownerSecurity.test.js
      - name: Syntax check
        run: npm run check:syntax
      - name: Full regression failure locator
        shell: bash
        run: |
          set +e
          npm test > /tmp/sg-tests.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "=== FAILURE LOCATOR ==="
            grep -n -E -A18 -B6 'not ok|AssertionError|ERR_ASSERTION|testCodeFailure|Error:' /tmp/sg-tests.log | tail -n 260 || tail -n 260 /tmp/sg-tests.log
          else
            tail -n 40 /tmp/sg-tests.log
          fi
          exit "$status"
      - run: npm start
      - run: npm run start:worker
