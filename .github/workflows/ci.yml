name: SG 2.1 CI

on:
  pull_request:
    branches:
      - main

concurrency:
  group: sg21-ci-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sg
          POSTGRES_PASSWORD: sg
          POSTGRES_DB: sg_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sg -d sg_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://sg:sg@localhost:5432/sg_test
      DATABASE_SSL: "false"
      SG_PERSISTENCE_MODE: postgres
      SG_ENVIRONMENT: ci
      SG_REVISION: block-19
      SG_PROJECT_SCOPE: sg2.1
      SG_WORKER_VERIFY: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run migrate
      - name: Block 19 security gate
        run: npm run security:check
      - name: Run npm run check
        shell: bash
        run: |
          set +e
          npm run check 2>&1 | tee /tmp/sg-check.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            summary=$(tail -n 40 /tmp/sg-check.log | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g; s/::/%3A%3A/g' | cut -c1-3500)
            echo "::error title=SG npm run check failed::${summary}"
            exit "$status"
          fi
      - run: npm start
      - run: npm run start:worker
      - name: Verify independent diagnostics service
        env:
          DIAGNOSTICS_ADMIN_TOKEN: ci-diagnostics-token
          SG_MONARCH_GLOBAL_USER_ID: usr_ci_monarch
          PORT: "18790"
        run: |
          npm run start:diagnostics > /tmp/sg-diagnostics.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:18790/health > /tmp/sg-diagnostics-health.json; then
              cat /tmp/sg-diagnostics-health.json
              exit 0
            fi
            sleep 0.5
          done
          cat /tmp/sg-diagnostics.log
          exit 1
