name: GitHub Webhook Observation Intake Smoke

on:
  workflow_dispatch:
  pull_request:
    branches:
      - dev/v2-start

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: |
          node --check src/integrations/github/webhook/githubWebhookSignatureVerifier.js
          node --check src/integrations/github/webhook/githubWebhookEventNormalizer.js
          node --check src/integrations/github/webhook/githubWebhookObservationBridge.js
          node --check src/app/githubWebhookRoutes.js
          node --check scripts/smokeGithubWebhookObservationIntakeSkeleton.js
      - run: node ./scripts/smokeGithubWebhookObservationIntakeSkeleton.js
