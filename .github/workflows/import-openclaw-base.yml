name: Import OpenClaw base

on:
  push:
    branches:
      - dev/sg2.2-openclaw
    paths:
      - .github/workflows/import-openclaw-base.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: import-openclaw-base
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out SG 2.2
        uses: actions/checkout@v4
        with:
          ref: dev/sg2.2-openclaw
          fetch-depth: 0

      - name: Fetch pinned OpenClaw base
        env:
          OPENCLAW_COMMIT: 8fe2c1b83ca2a30d62892d3bf188588190155fd0
        run: |
          git clone --no-checkout --filter=blob:none https://github.com/openclaw/openclaw.git /tmp/openclaw
          git -C /tmp/openclaw checkout --detach "$OPENCLAW_COMMIT"
          test "$(git -C /tmp/openclaw rev-parse HEAD)" = "$OPENCLAW_COMMIT"

      - name: Replace branch contents with OpenClaw
        run: |
          cp pillars/roadmap/SG_2_2_OPENCLAW_MIGRATION.md /tmp/SG_2_2_OPENCLAW_MIGRATION.md
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          tar -C /tmp/openclaw --exclude=.git -cf - . | tar -xf -
          mkdir -p pillars/roadmap
          cp /tmp/SG_2_2_OPENCLAW_MIGRATION.md pillars/roadmap/SG_2_2_OPENCLAW_MIGRATION.md

      - name: Record SG 2.2 OpenClaw baseline
        run: |
          mkdir -p pillars/baselines
          {
            echo '# SG 2.2 OpenClaw Base'
            echo
            echo '- Source: https://github.com/openclaw/openclaw'
            echo '- Commit: 8fe2c1b83ca2a30d62892d3bf188588190155fd0'
            echo '- Imported: 2026-08-24'
            echo '- Checklist item: 1. OpenClaw base'
            echo '- Status: IMPLEMENTED'
          } > pillars/baselines/OPENCLAW_BASE.md

      - name: Commit imported base
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat(sg2.2): import pinned OpenClaw base"
          git push origin HEAD:dev/sg2.2-openclaw

