name: Observation Auto Dispatch Probe Smoke

on:
  workflow_dispatch:
  pull_request:
    branches:
      - dev/v2-start

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: |
          node --check scripts/smokeObservationAutoDispatchProbe.js
          node --check src/agents/observation-trigger-dispatch-agent/observationTriggerDispatchRegistry.js
      - run: node ./scripts/smokeObservationAutoDispatchProbe.js
