name: Repo Commit Watcher

on:
  workflow_dispatch:
  push:
    branches:
      - dev/v2-start
    paths-ignore:
      - "runtime/repo/latest/latest-repo-registry.json"
      - "runtime/repo/latest/latest-commit-state.json"

permissions:
  contents: write
  actions: read

jobs:
  repo-commit-watcher:
    name: Update repo registry after commits
    runs-on: ubuntu-latest

    steps:
      - name: Checkout dev branch
        uses: actions/checkout@v4
        with:
          ref: dev/v2-start

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run repo commit watcher agent
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPO: korzh260609-beep/garya-bot
          GITHUB_BRANCH: dev/v2-start
        run: node src/agents/repo-commit-watcher-agent/runRepoCommitWatcherAgent.js

      - name: Dispatch GitHub PR merged observation event
        if: github.event_name == 'push' && contains(github.event.head_commit.message, 'Merge PR #')
        env:
          OBSERVATION_DISPATCH_EVENT_TYPE: github.pr_merged
        run: node src/agents/observation-trigger-dispatch-agent/runObservationTriggerDispatchAgent.js
