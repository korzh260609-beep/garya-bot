name: SG2 AI Tool Runtime Command Adapter Smoke

on:
  workflow_dispatch:
  pull_request:
    branches:
      - dev/v2-start

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: |
          node --check src/ai/runtime/aiToolRuntimeCommandAdapter.js
          node --check src/ai/runtime/aiToolRuntimeInvocationBridge.js
          node --check src/ai/runtime/index.js
          node --check scripts/smokeAiToolRuntimeCommandAdapter.js
      - run: node ./scripts/smokeAiToolRuntimeCommandAdapter.js
