name: SG2 Message Diagnostics Command Bridge Smoke

on:
  workflow_dispatch:
  pull_request:
    branches:
      - dev/v2-start
    paths:
      - "src/core/handleMessage.js"
      - "src/core/message/messageDiagnosticsCommandBridge.js"
      - "src/core/message/messageDiagnosticsRoute.js"
      - "scripts/smokeMessageDiagnosticsCommandBridge.js"
      - ".github/workflows/sg2-message-diagnostics-command-bridge-smoke.yml"

jobs:
  smoke:
    name: Message diagnostics command bridge smoke
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Check bridge syntax
        run: node --check src/core/message/messageDiagnosticsCommandBridge.js

      - name: Check smoke syntax
        run: node --check scripts/smokeMessageDiagnosticsCommandBridge.js

      - name: Run message diagnostics command bridge smoke
        run: node scripts/smokeMessageDiagnosticsCommandBridge.js
