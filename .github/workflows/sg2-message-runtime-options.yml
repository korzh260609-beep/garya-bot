name: SG2 Message Runtime Options

# Dedicated smoke workflow for message runtime options explicit project context bridge.
on:
  workflow_dispatch:
  pull_request:
    branches:
      - dev/v2-start
    paths:
      - "src/core/handleMessage.js"
      - "src/core/message/messageInput.js"
      - "src/core/message/index.js"
      - "scripts/smokeMessageRuntimeOptionsExplicitProjectContext.js"
      - "package.json"
      - ".github/workflows/sg2-message-runtime-options.yml"

jobs:
  smoke-message-runtime-options:
    name: Message runtime options explicit project context smoke
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Check message runtime options syntax
        run: |
          node --check src/core/handleMessage.js
          node --check src/core/message/messageInput.js
          node --check src/core/message/index.js

      - name: Check message runtime options smoke syntax
        run: node --check scripts/smokeMessageRuntimeOptionsExplicitProjectContext.js

      - name: Smoke message runtime options explicit project context
        run: npm run smoke:message-runtime-options-explicit-project-context
