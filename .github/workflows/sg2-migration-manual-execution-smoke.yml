name: SG2 Migration Manual Execution Smoke

# Focused SG2 workflow for manual migration execution boundary skeleton.
on:
  workflow_dispatch:
  pull_request:
    branches:
      - dev/v2-start
    paths:
      - "src/db/migrations/migrationManualExecutionBoundary.js"
      - "scripts/smokeMigrationManualExecutionBoundary.js"
      - "package.json"
      - ".github/workflows/sg2-migration-manual-execution-smoke.yml"

jobs:
  migration-manual-execution-smoke:
    name: Migration manual execution boundary smoke
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Check migration manual execution syntax
        run: |
          node --check src/db/migrations/migrationManualExecutionBoundary.js
          node --check scripts/smokeMigrationManualExecutionBoundary.js

      - name: Smoke migration manual execution boundary
        run: npm run smoke:migration-manual-execution-boundary
