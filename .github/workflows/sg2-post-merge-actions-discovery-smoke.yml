name: SG2 Post-Merge Actions Discovery Smoke

on:
  pull_request:
    branches:
      - dev/v2-start
  push:
    branches:
      - dev/v2-start
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  post-merge-actions-discovery-smoke:
    name: SG2 Post-Merge Actions Discovery Smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Verify post-merge workflow configuration
        run: npm run smoke:post-merge-actions-discovery-workflow

      - name: Verify GitHub Actions commit runs diagnostic boundaries
        run: npm run smoke:github-actions-commit-runs-check
