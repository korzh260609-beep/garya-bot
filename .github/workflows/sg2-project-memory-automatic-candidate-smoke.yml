name: SG2 Project Memory Automatic Candidate Smoke

# Focused smoke for the Project Memory automatic candidate pipeline skeleton.
on:
  workflow_dispatch:
  push:
    branches:
      - dev/v2-start
  pull_request:
    branches:
      - dev/v2-start

jobs:
  smoke:
    name: Project Memory automatic candidate pipeline smoke
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Check Project Memory automatic candidate syntax
        run: |
          node --check src/memory/project/projectMemoryAutomaticCandidatePipeline.js
          node --check scripts/smokeProjectMemoryAutomaticCandidatePipeline.js

      - name: Smoke Project Memory automatic candidate pipeline
        run: npm run smoke:project-memory-automatic-candidate-pipeline
