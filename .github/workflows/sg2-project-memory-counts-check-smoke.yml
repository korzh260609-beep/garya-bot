name: SG2 Project Memory Counts Check Smoke

on:
  workflow_dispatch:
  pull_request:
    branches:
      - dev/v2-start
    paths:
      - "src/diagnostics/projectMemoryCountsCheck.js"
      - "src/agents/diagnostics-check-agent/diagnosticsCheckRegistry.js"
      - "src/diagnostics/projectMemoryProductionReadinessDiagnosticsSuite.js"
      - "scripts/smokeProjectMemoryCountsCheck.js"
      - "scripts/smokeProjectMemoryProductionReadinessDiagnosticsSuite.js"
      - ".github/workflows/sg2-project-memory-counts-check-smoke.yml"

jobs:
  smoke-project-memory-counts-check:
    name: Project Memory counts check smoke
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Check counts smoke syntax
        run: node --check scripts/smokeProjectMemoryCountsCheck.js

      - name: Smoke counts check
        run: node scripts/smokeProjectMemoryCountsCheck.js

      - name: Smoke readiness suite includes counts
        run: node scripts/smokeProjectMemoryProductionReadinessDiagnosticsSuite.js
