name: SG2 Project Memory Diagnostics Smoke

on:
  workflow_dispatch:
  pull_request:
    branches:
      - dev/v2-start

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: |
          node --check src/memory/project/projectMemoryDiagnostics.js
          node --check scripts/smokeProjectMemoryDiagnostics.js
      - run: node ./scripts/smokeProjectMemoryDiagnostics.js
