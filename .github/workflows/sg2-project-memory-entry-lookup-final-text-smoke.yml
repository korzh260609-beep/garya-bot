name: SG2 Project Memory Entry Lookup Final Text Smoke

on:
  workflow_dispatch:
  pull_request:
    branches:
      - dev/v2-start
    paths:
      - "src/diagnostics/diagnosticsRunner.js"
      - "scripts/smokeProjectMemoryEntryLookupFinalText.js"
      - ".github/workflows/sg2-project-memory-entry-lookup-final-text-smoke.yml"

jobs:
  smoke:
    name: Project Memory entry lookup final text smoke
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Check diagnostics runner syntax
        run: node --check src/diagnostics/diagnosticsRunner.js

      - name: Check smoke syntax
        run: node --check scripts/smokeProjectMemoryEntryLookupFinalText.js

      - name: Run Project Memory entry lookup final text smoke
        run: node scripts/smokeProjectMemoryEntryLookupFinalText.js
