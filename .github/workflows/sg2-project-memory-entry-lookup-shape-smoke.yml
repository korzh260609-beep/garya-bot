name: SG2 Project Memory Entry Lookup Shape Smoke

on:
  workflow_dispatch:
  pull_request:
    branches:
      - dev/v2-start
    paths:
      - "src/diagnostics/projectMemoryEntryLookupCheck.js"
      - "scripts/smokeProjectMemoryEntryLookupShape.js"
      - ".github/workflows/sg2-project-memory-entry-lookup-shape-smoke.yml"

jobs:
  smoke:
    name: Project Memory entry lookup shape smoke
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Check diagnostics syntax
        run: node --check src/diagnostics/projectMemoryEntryLookupCheck.js

      - name: Check smoke syntax
        run: node --check scripts/smokeProjectMemoryEntryLookupShape.js

      - name: Run Project Memory entry lookup shape smoke
        run: node scripts/smokeProjectMemoryEntryLookupShape.js
