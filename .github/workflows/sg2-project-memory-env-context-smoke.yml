name: SG2 Project Memory Env Context Smoke

on:
  workflow_dispatch:
  pull_request:
    branches:
      - dev/v2-start

jobs:
  smoke:
    name: Project Memory env context activation smoke
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Check smoke syntax
        run: node --check scripts/smokeMessageProjectMemoryPromptInjectionEnvActivation.js

      - name: Run Project Memory env context smoke
        run: npm run smoke:message-project-memory-env-context-activation
