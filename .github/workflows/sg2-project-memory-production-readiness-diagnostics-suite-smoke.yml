name: SG2 Project Memory Production Readiness Diagnostics Suite Smoke

on:
  pull_request:
    branches:
      - dev/v2-start
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: node --check src/diagnostics/projectMemoryProductionReadinessDiagnosticsSuite.js
      - run: node --check src/diagnostics/diagnosticsPlan.js
      - run: node --check scripts/smokeProjectMemoryProductionReadinessDiagnosticsSuite.js
      - run: npm run smoke:project-memory-production-readiness-diagnostics-suite
