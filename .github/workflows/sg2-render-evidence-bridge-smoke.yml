name: SG2 Render Evidence Bridge Smoke

on:
  pull_request:
    branches:
      - dev/v2-start
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: node --check src/integrations/render/RenderEvidenceConfig.js
      - run: node --check src/integrations/render/RenderEvidenceBridge.js
      - run: node --check scripts/smokeRenderEvidenceBridge.js
      - run: node ./scripts/smokeRenderEvidenceBridge.js
