name: SG2 Repo Commit Observation Smoke

on:
  workflow_dispatch:
  pull_request:
    branches:
      - dev/v2-start

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: |
          node --check src/agents/observation/repoCommitObservationBridge.js
          node --check src/agents/repo-commit-watcher-agent/repoCommitWatcherAgent.js
          node --check scripts/smokeRepoCommitObservationBridge.js
      - run: node ./scripts/smokeRepoCommitObservationBridge.js
