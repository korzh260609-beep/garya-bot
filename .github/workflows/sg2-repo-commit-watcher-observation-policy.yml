name: SG2 Repo Commit Watcher Observation Policy

# Dedicated smoke workflow for watcher → observation dispatch policy.
on:
  workflow_dispatch:
  pull_request:
    branches:
      - dev/v2-start
    paths:
      - ".github/workflows/repo-commit-watcher.yml"
      - ".github/workflows/sg2-repo-commit-watcher-observation-policy.yml"
      - "src/agents/observation-trigger-dispatch-agent/observationTriggerDispatchRegistry.js"
      - "scripts/smokeRepoCommitWatcherObservationDispatchPolicy.js"
      - "package.json"

jobs:
  smoke-repo-commit-watcher-observation-policy:
    name: Repo Commit Watcher observation policy smoke
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Check repo commit watcher workflow policy smoke syntax
        run: node --check scripts/smokeRepoCommitWatcherObservationDispatchPolicy.js

      - name: Smoke repo commit watcher observation policy
        run: npm run smoke:repo-commit-watcher-observation-policy
