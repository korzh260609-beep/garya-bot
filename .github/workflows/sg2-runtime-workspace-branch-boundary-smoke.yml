name: SG2 Runtime Workspace Branch Boundary Smoke

on:
  pull_request:
    branches:
      - dev/v2-start
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: node --check src/runtime/workspace/workspaceChannel.js
      - run: node --check scripts/smokeWorkspaceRuntimeBranchBoundary.js
      - run: npm run smoke:runtime-workspace-branch-boundary
