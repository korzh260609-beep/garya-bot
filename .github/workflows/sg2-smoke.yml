name: SG2 Smoke

# SG2 dev branch smoke workflow.
on:
  workflow_dispatch:
  push:
    branches:
      - dev/v2-start
  pull_request:
    branches:
      - dev/v2-start

jobs:
  smoke:
    name: SG2 syntax and dependency smoke
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Check entrypoint syntax
        run: node --check index.js

      - name: Check app startup syntax
        run: |
          node --check src/app/appFactory.js
          node --check src/app/healthRoutes.js
          node --check src/app/healthStatus.js
          node --check src/app/rootRoutes.js
          node --check src/app/runtimeStatusPresenter.js
          node --check src/app/runtimeHooks.js
          node --check src/app/projectMemoryBootstrap.js
          node --check src/app/serverStartup.js
          node --check src/app/index.js

      - name: Check config syntax
        run: |
          node --check src/config/env.js
          node --check src/config/envPrimitives.js
          node --check src/config/telegramConfig.js
          node --check src/config/runtimeConfig.js

      - name: Check DB syntax
        run: |
          node --check src/db/postgresClient.js

      - name: Check SG core syntax
        run: |
          node --check src/core/handleMessage.js
          node --check src/core/sgSystemPrompt.js
          node --check src/core/projectRuntimeContext.js
          node --check src/core/githubApprovalHandler.js

      - name: Check SG core message syntax
        run: |
          node --check src/core/message/messageInput.js
          node --check src/core/message/messageAccess.js
          node --check src/core/message/messageBehavior.js
          node --check src/core/message/messageAiRequest.js
          node --check src/core/message/messageContextInjection.js
          node --check src/core/message/messageProjectMemoryContextGate.js
          node --check src/core/message/messageGithubApproval.js
          node --check src/core/message/index.js

      - name: Check SG GitHub approval syntax
        run: |
          node --check src/core/githubApproval/githubApprovalCallbackParser.js
          node --check src/core/githubApproval/githubApprovalAccess.js
          node --check src/core/githubApproval/githubApprovalResultFormatter.js
          node --check src/core/githubApproval/githubApprovalExecutor.js
          node --check src/core/githubApproval/index.js

      - name: Check SG prompt syntax
        run: |
          node --check src/core/prompt/promptIdentity.js
          node --check src/core/prompt/promptBehaviorRules.js
          node --check src/core/prompt/promptLanguageRules.js
          node --check src/core/prompt/promptRuntimeContext.js
          node --check src/core/prompt/promptGithubRuntime.js
          node --check src/core/prompt/promptGithubWritePolicy.js
          node --check src/core/prompt/promptGithubOutputFormat.js
          node --check src/core/prompt/promptRuntimeStatus.js
          node --check src/core/prompt/index.js

      - name: Check AI layer syntax
        run: |
          node --check src/ai/callAI.js
          node --check src/ai/modelConfig.js
          node --check src/ai/openaiClient.js
          node --check src/ai/aiInputMapper.js
          node --check src/ai/aiOutputParser.js
          node --check src/ai/aiToolContext.js
          node --check src/ai/aiToolMetadata.js
          node --check src/ai/aiToolRunner.js

      - name: Check GitHub tool syntax
        run: |
          node --check src/tools/githubTool.js
          node --check src/tools/githubToolDefinitions.js
          node --check src/tools/githubActionsFormatter.js
          node --check src/tools/github/githubRequestUtils.js
          node --check src/tools/github/githubApiClient.js
          node --check src/tools/github/githubApprovalStore.memory.js
          node --check src/tools/github/githubWriteSummary.js
          node --check src/tools/github/githubApprovalWarning.js
          node --check src/tools/github/githubWritePolicy.js
          node --check src/tools/github/githubApprovalService.js
          node --check src/tools/github/githubProjectDefaults.js
          node --check src/tools/github/index.js
          node --check src/integrations/github/appAuth.js

      - name: Check Users identity syntax
        run: |
          node --check src/users/globalIdentity.js
          node --check src/users/userRegistrySchema.js
          node --check src/users/userRegistryStore.js
          node --check src/users/userIdentityLinking.js
          node --check src/users/userIdentityLinkingPolicy.js
          node --check src/users/userIdentityLinkRequestConstants.js
          node --check src/users/userIdentityLinkRequestHelpers.js
          node --check src/users/userIdentityLinkRequestStore.js
          node --check src/users/userIdentityLinkRequests.js
          node --check src/users/identityResolver.js

      - name: Check Projects syntax
        run: |
          node --check src/projects/userProjectsTypes.js
          node --check src/projects/userProjectsSchema.js
          node --check src/projects/userProjectsStore.js
          node --check src/projects/userProjectRuntimeContext.js
          node --check src/projects/index.js

      - name: Check Diagnostics Layer syntax
        run: |
          node --check src/diagnostics/diagnosticsIntent.js
          node --check src/diagnostics/diagnosticsObservationBridge.js
          node --check src/diagnostics/diagnosticsPlan.js
          node --check src/diagnostics/diagnosticsReport.js
          node --check src/diagnostics/diagnosticsRunner.js
          node --check src/diagnostics/observationLatestReportCheck.js
          node --check src/diagnostics/projectMemoryRuntimeCheck.js
          node --check src/diagnostics/usersIdentityLinkingCheck.js
          node --check src/diagnostics/usersIdentityLinkRequestsCheck.js
          node --check src/diagnostics/usersIdentityRegistryCheck.js
          node --check src/diagnostics/index.js

      - name: Check Workspace channel syntax
        run: |
          node --check src/runtime/workspace/workspaceChannel.js

      - name: Check Render tasks syntax
        run: |
          node --check src/tasks/render/getRenderLogsTask.js

      - name: Check Render bridge syntax
        run: |
          node --check src/integrations/render/renderBridgeConfig.js
          node --check src/integrations/render/renderBridgeNormalizer.js
          node --check src/integrations/render/renderBridgeClient.js
          node --check src/integrations/render/renderSanitizer.js
          node --check src/integrations/render/renderLatestLogs.js
          node --check src/integrations/render/index.js

      - name: Check Project Memory syntax
        run: |
          node --check src/memory/project/projectMemoryOwnership.js
          node --check src/memory/project/projectMemoryConfirmation.js
          node --check src/memory/project/projectMemoryExplicitConfirmationFlow.js
          node --check src/memory/project/projectMemoryManualCandidateFlow.js
          node --check src/memory/project/projectMemoryRuntimeContext.js
          node --check src/memory/project/projectMemoryUserProjectValidator.js

      - name: Check smoke scripts syntax
        run: |
          node --check scripts/smokeDiagnosticsDefaultPlanJournalHealth.js
          node --check scripts/smokeMessageProjectMemoryContextGate.js
          node --check scripts/smokeMessageProjectMemoryProjectKeyRuntimeSelection.js
          node --check scripts/smokeObservationDispatchGithubEvents.js
          node --check scripts/smokeObservationJournalHealthLatestCheck.js
          node --check scripts/smokeObservationJournalHealthTrigger.js
          node --check scripts/smokeObservationTriggerDispatchAgent.js
          node --check scripts/smokeProjectMemoryExplicitConfirmationFlow.js
          node --check scripts/smokeProjectMemoryManualCandidateFlow.js
          node --check scripts/smokeProjectMemoryOwnershipScope.js
          node --check scripts/smokeProjectMemoryRuntimeContext.js
          node --check scripts/smokeProjectMemoryRuntimeDiagnostics.js
          node --check scripts/smokeProjectMemorySchemaBootstrap.js
          node --check scripts/smokeProjectMemorySkeleton.js
          node --check scripts/smokeProjectMemoryStorageConfirmation.js
          node --check scripts/smokeProjectMemoryUserProjectGuard.js
          node --check scripts/smokeProjectMemoryUserProjectValidator.js
          node --check scripts/smokeUserProjectRuntimeContext.js
          node --check scripts/smokeUserProjectsRegistry.js

      - name: Smoke GitHub Actions formatter
        run: npm run smoke:github-actions-formatter

      - name: Smoke disabled message context injection
        run: npm run smoke:message-context-injection

      - name: Smoke diagnostics default plan journal health
        run: npm run smoke:diagnostics-default-plan-journal-health

      - name: Smoke diagnostics observation bridge
        run: npm run smoke:diagnostics-observation-bridge

      - name: Smoke format-only message context injection
        run: npm run smoke:message-context-injection-format-only

      - name: Smoke system-context message context injection
        run: npm run smoke:message-context-injection-system-context

      - name: Smoke message context injection guards
        run: npm run smoke:message-context-injection-guards

      - name: Smoke message project memory context gate
        run: npm run smoke:message-project-memory-context-gate

      - name: Smoke message project memory projectKey runtime selection
        run: npm run smoke:message-project-memory-projectkey-runtime-selection

      - name: Smoke GitHub observation dispatch events
        run: npm run smoke:observation-dispatch-github-events

      - name: Smoke observation journal health latest check
        run: npm run smoke:observation-journal-health-latest-check

      - name: Smoke observation journal health trigger
        run: npm run smoke:observation-journal-health-trigger

      - name: Smoke observation latest report check
        run: npm run smoke:observation-latest-report-check

      - name: Smoke observation producer
        run: npm run smoke:observation-producer

      - name: Smoke observation trigger dispatch agent
        run: npm run smoke:observation-trigger-dispatch-agent

      - name: Smoke observation trigger layer
        run: npm run smoke:observation-trigger-layer

      - name: Smoke project memory explicit confirmation flow
        run: npm run smoke:project-memory-explicit-confirmation-flow

      - name: Smoke project memory manual candidate flow
        run: npm run smoke:project-memory-manual-candidate-flow

      - name: Smoke project memory ownership scope
        run: npm run smoke:project-memory-ownership-scope

      - name: Smoke project memory runtime context
        run: npm run smoke:project-memory-runtime-context

      - name: Smoke project memory runtime diagnostics
        run: npm run smoke:project-memory-runtime-diagnostics

      - name: Smoke project memory schema bootstrap
        run: npm run smoke:project-memory-schema-bootstrap

      - name: Smoke project memory skeleton
        run: npm run smoke:project-memory-skeleton

      - name: Smoke project memory storage confirmation
        run: npm run smoke:project-memory-storage-confirmation

      - name: Smoke project memory user project guard
        run: npm run smoke:project-memory-user-project-guard

      - name: Smoke project memory user project validator
        run: npm run smoke:project-memory-user-project-validator

      - name: Smoke runtime status observation bridge
        run: npm run smoke:runtime-status-observation-bridge

      - name: Smoke user project runtime context
        run: npm run smoke:user-project-runtime-context

      - name: Smoke user projects registry
        run: npm run smoke:user-projects-registry

      - name: Smoke users identity registry diagnostics
        run: npm run smoke:users-identity-registry

      - name: Smoke users identity linking skeleton
        run: npm run smoke:users-identity-linking

      - name: Smoke users identity linking diagnostics
        run: npm run smoke:users-identity-linking-check

      - name: Smoke users identity linking policy
        run: npm run smoke:users-identity-linking-policy

      - name: Smoke users identity link requests
        run: npm run smoke:users-identity-link-requests

      - name: Smoke users identity link requests diagnostics
        run: npm run smoke:users-identity-link-requests-check

      - name: Check Agent Layer syntax
        run: |
          node --check src/agents/index.js
          node --check src/agents/github-actions-agent/GitHubActionsAgentService.js
          node --check src/agents/github-actions-agent/GitHubActionsAgentReportBuilder.js
          node --check src/agents/github-actions-agent/index.js
          node --check src/agents/repo-commit-watcher-agent/index.js
          node --check src/agents/repo-commit-watcher-agent/repoCommitWatcherAgent.js
          node --check src/agents/repo-commit-watcher-agent/repoCommitSearch.js
          node --check src/agents/repo-commit-watcher-agent/runRepoCommitWatcherAgent.js
          node --check src/agents/render-env-agent/renderEnvAgent.js
          node --check src/agents/repo-registry-agent/repoRegistryAgent.js
          node --check src/agents/observation-trigger-dispatch-agent/observationTriggerDispatchAgent.js
          node --check src/agents/observation-trigger-dispatch-agent/observationTriggerDispatchRegistry.js
          node --check src/agents/observation-trigger-dispatch-agent/runObservationTriggerDispatchAgent.js
          node --check src/agents/observation-trigger-dispatch-agent/index.js
          node --check src/agents/observation/eventSchema.js
          node --check src/agents/observation/journalHealthObservationBridge.js
          node --check src/agents/observation/observationPaths.js
          node --check src/agents/observation/observationProducer.js
          node --check src/agents/observation/observationReader.js
          node --check src/agents/observation/observationWriter.js
          node --check src/agents/observation/runtimeStatusObservationBridge.js
          node --check src/agents/observation/triggers/observationTriggerRegistry.js
          node --check src/agents/observation/triggers/observationTriggerRunner.js
          node --check src/agents/observation/triggers/index.js
          node --check src/agents/observation/index.js

      - name: Check Telegram transport syntax
        run: |
          node --check src/transport/telegram.js
          node --check src/transport/telegram/telegramAdapter.js
          node --check src/transport/telegram/telegramContext.js
          node --check src/transport/telegram/telegramReplies.js
          node --check src/transport/telegram/telegramMessageHandler.js
          node --check src/transport/telegram/telegramCallbackHandler.js
          node --check src/transport/telegram/index.js
          node --check src/delivery/telegramDelivery.js
