name: SG 2.2 import OpenClaw base

on:
  push:
    branches:
      - dev/sg2.2-openclaw

permissions:
  contents: write

jobs:
  import-openclaw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/sg2.2-openclaw
      - name: Fetch OpenClaw
        run: |
          git clone https://github.com/openclaw/openclaw.git /tmp/openclaw
          git -C /tmp/openclaw checkout 8fe2c1b83ca2a30d62892d3bf188588190155fd0
      - name: Copy OpenClaw base
        run: |
          rsync -a --exclude='.git' --exclude='pillars/roadmap/SG_2_2_OPENCLAW_MIGRATION.md' /tmp/openclaw/ ./
          echo 8fe2c1b83ca2a30d62892d3bf188588190155fd0 > OPENCLAW_BASE_COMMIT
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'chore(sg2.2): import pinned OpenClaw base'
          git push origin HEAD:dev/sg2.2-openclaw
