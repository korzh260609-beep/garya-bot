name: SG 2.2 import OpenClaw base

on:
  push:
    branches:
      - dev/sg2.2-openclaw
    paths:
      - .github/workflows/sg22-import-openclaw.yml

permissions:
  contents: write

jobs:
  import-openclaw:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout SG 2.2 branch
        uses: actions/checkout@v4
        with:
          ref: dev/sg2.2-openclaw
          fetch-depth: 0

      - name: Import pinned OpenClaw base and preserve SG roadmap
        shell: bash
        run: |
          set -euo pipefail
          OPENCLAW_SHA="8fe2c1b83ca2a30d62892d3bf188588190155fd0"
          ROADMAP="pillars/roadmap/SG_2_2_OPENCLAW_MIGRATION.md"

          mkdir -p /tmp/sg22-preserve
          cp "$ROADMAP" /tmp/sg22-preserve/SG_2_2_OPENCLAW_MIGRATION.md

          git clone --filter=blob:none --no-checkout https://github.com/openclaw/openclaw.git /tmp/openclaw
          git -C /tmp/openclaw checkout "$OPENCLAW_SHA"

          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          rsync -a --exclude='.git' /tmp/openclaw/ ./

          mkdir -p pillars/roadmap
          cp /tmp/sg22-preserve/SG_2_2_OPENCLAW_MIGRATION.md "$ROADMAP"

          printf '%s\n' "$OPENCLAW_SHA" > OPENCLAW_BASE_COMMIT

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(sg2.2): import pinned OpenClaw base"
          git push origin HEAD:dev/sg2.2-openclaw
