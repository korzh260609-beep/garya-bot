name: SG 2.2 Render Image

on:
  push:
    branches:
      - dev/sg2.2-openclaw
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  statuses: write

concurrency:
  group: sg22-render-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Mark image build pending
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -fsSL \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d '{"state":"pending","context":"sg22/render-image","description":"SG 2.2 image build in progress"}'

      - name: Checkout SG 2.2
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.22.0 --activate

      - name: Recreate missing lockfile for exact SG 2.2 source
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Install dependencies for SG plugin tests
        run: pnpm install --frozen-lockfile

      - name: Test WSP1-WSP6 plugin contracts
        run: node scripts/run-vitest.mjs run --config sg/plugin/vitest.config.ts

      - name: Test OpenClaw compaction decimal identifier fix
        run: pnpm test src/agents/agent-hooks/compaction-safeguard.test.ts

      - name: Test OpenClaw transcript byte compaction backport
        run: |
          pnpm test \
            src/auto-reply/reply/agent-runner-memory.test.ts \
            src/auto-reply/reply/agent-runner-session-reset.test.ts \
            src/auto-reply/reply/session-updates.lifecycle.test.ts \
            src/config/sessions/session-accessor.conformance.test.ts \
            src/config/sessions/session-accessor.sqlite-message-cut.test.ts \
            src/plugin-sdk/session-store-runtime.writer-claim.test.ts

      - name: Type-check OpenClaw core and source tests
        run: |
          pnpm tsgo:core
          pnpm tsgo:test:src

      - name: Test SG Render entrypoint allowlist
        run: pnpm test test/scripts/sg22-render-entrypoint.test.ts

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build compiled SG 2.2 OpenClaw base
        run: |
          docker build \
            --build-arg GIT_COMMIT="${GITHUB_SHA}" \
            --build-arg OPENCLAW_EXTENSIONS="codex" \
            --build-arg OPENCLAW_DOCKER_BUILD_SKIP_DTS=1 \
            --build-arg OPENCLAW_DOCKER_BUILD_TSDOWN_MAX_OLD_SPACE_MB=4096 \
            -f Dockerfile \
            -t sg22-openclaw-base:${GITHUB_SHA} \
            .

      - name: Add SG entity workspace overlay
        run: |
          docker build \
            --build-arg SG22_BASE_IMAGE="sg22-openclaw-base:${GITHUB_SHA}" \
            --build-arg SG22_IMAGE_COMMIT="${GITHUB_SHA}" \
            -f Dockerfile.sg22-overlay \
            -t ghcr.io/korzh260609-beep/garya-bot-sg22:${GITHUB_SHA} \
            -t ghcr.io/korzh260609-beep/garya-bot-sg22:dev \
            .

      - name: Publish SG 2.2 image
        run: |
          docker push ghcr.io/korzh260609-beep/garya-bot-sg22:${GITHUB_SHA}
          docker push ghcr.io/korzh260609-beep/garya-bot-sg22:dev

      - name: Publish visible image build status
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then
            state=success
            description="SG 2.2 image published"
          else
            state=failure
            description="SG 2.2 image build failed"
          fi
          curl -fsSL \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"${state}\",\"context\":\"sg22/render-image\",\"description\":\"${description}\"}"
