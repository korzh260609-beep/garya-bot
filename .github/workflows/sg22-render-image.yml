name: SG 2.2 Render Image

on:
  push:
    branches:
      - dev/sg2.2-openclaw
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: sg22-render-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout SG 2.2
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.22.0 --activate

      - name: Recreate missing lockfile for exact SG 2.2 source
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build compiled SG 2.2 OpenClaw base
        run: |
          docker build \
            --build-arg GIT_COMMIT="${GITHUB_SHA}" \
            --build-arg OPENCLAW_DOCKER_BUILD_SKIP_DTS=1 \
            --build-arg OPENCLAW_DOCKER_BUILD_TSDOWN_MAX_OLD_SPACE_MB=4096 \
            -f Dockerfile \
            -t sg22-openclaw-base:${GITHUB_SHA} \
            .

      - name: Add SG entity workspace overlay
        run: |
          docker build \
            --build-arg SG22_BASE_IMAGE="sg22-openclaw-base:${GITHUB_SHA}" \
            -f Dockerfile.sg22-overlay \
            -t ghcr.io/korzh260609-beep/garya-bot-sg22:${GITHUB_SHA} \
            -t ghcr.io/korzh260609-beep/garya-bot-sg22:dev \
            .

      - name: Publish SG 2.2 image
        run: |
          docker push ghcr.io/korzh260609-beep/garya-bot-sg22:${GITHUB_SHA}
          docker push ghcr.io/korzh260609-beep/garya-bot-sg22:dev
