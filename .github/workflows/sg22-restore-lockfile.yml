name: SG 2.2 Restore pnpm lockfile

on:
  push:
    branches:
      - dev/sg2.2-openclaw
    paths:
      - .github/workflows/sg22-restore-lockfile.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout SG 2.2
        uses: actions/checkout@v4
        with:
          ref: dev/sg2.2-openclaw

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Generate pnpm lockfile from current workspace
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Commit restored lockfile
        shell: bash
        run: |
          if git diff --quiet -- pnpm-lock.yaml && git ls-files --error-unmatch pnpm-lock.yaml >/dev/null 2>&1; then
            echo "pnpm-lock.yaml already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "fix(sg2.2): restore OpenClaw pnpm lockfile"
          git push origin HEAD:dev/sg2.2-openclaw
