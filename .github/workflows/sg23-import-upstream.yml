name: Import official OpenClaw v2026.9.8 for SG 2.3

on:
  push:
    branches:
      - dev/sg2.3-openclaw

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Import the verified release tree as a clean root commit
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git init -q upstream
          git -C upstream remote add source https://github.com/openclaw/openclaw.git
          git -C upstream fetch --depth=1 source refs/tags/v2026.9.8
          release_commit="$(git -C upstream rev-parse 'FETCH_HEAD^{commit}')"
          test "$release_commit" = fc23bc864e4553c2d215e479eeec47b67a0bf943
          release_tree="$(git -C upstream rev-parse "${release_commit}^{tree}")"
          git -C upstream show "${release_commit}:package.json" | grep -F '"version": "2026.9.8"' >/dev/null
          export GIT_AUTHOR_NAME="SG 2.3 import"
          export GIT_AUTHOR_EMAIL="actions@users.noreply.github.com"
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          git -C upstream remote add destination "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -C upstream fetch --depth=1 destination refs/heads/dev/sg2.3-openclaw
          current_commit="$(git -C upstream rev-parse 'FETCH_HEAD^{commit}')"
          test "$current_commit" = "$GITHUB_SHA"
          git -C upstream read-tree "$release_tree"
          git -C upstream rm -r --cached -q .github/workflows
          git -C upstream ls-tree -r "$current_commit" .github/workflows | git -C upstream update-index --index-info
          imported_tree="$(git -C upstream write-tree)"
          git -C upstream diff --name-only "$release_tree" "$imported_tree" | grep -v '^.github/workflows/' > /tmp/non-workflow-diff || true
          test ! -s /tmp/non-workflow-diff
          new_commit="$(git -C upstream commit-tree "$imported_tree" -m "Import OpenClaw v2026.9.8 source (upstream $release_commit)")"
          git -C upstream push --force-with-lease="refs/heads/dev/sg2.3-openclaw:${GITHUB_SHA}" destination "$new_commit:refs/heads/dev/sg2.3-openclaw"
