name: SG 2.3 Render Image

on:
  push:
    branches:
      - dev/sg2.3-openclaw
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: sg23-render-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout SG 2.3
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build SG 2.3 OpenClaw from branch source
        env:
          IMAGE: ghcr.io/korzh260609-beep/garya-bot-sg23
        run: |
          docker build \
            --build-arg GIT_COMMIT="${GITHUB_SHA}" \
            --build-arg OPENCLAW_EXTENSIONS="codex" \
            --build-arg "OPENCLAW_IMAGE_APT_PACKAGES=gh jq ripgrep ffmpeg tmux" \
            --build-arg OPENCLAW_INSTALL_BROWSER=1 \
            --build-arg OPENCLAW_DOCKER_BUILD_SKIP_DTS=1 \
            --build-arg OPENCLAW_DOCKER_BUILD_NODE_OPTIONS=--max-old-space-size=4096 \
            --build-arg OPENCLAW_DOCKER_BUILD_TSDOWN_MAX_OLD_SPACE_MB=4096 \
            -f Dockerfile \
            -t "${IMAGE}:${GITHUB_SHA}" \
            -t "${IMAGE}:dev" \
            .

      - name: Smoke-test OpenClaw runtime
        env:
          IMAGE: ghcr.io/korzh260609-beep/garya-bot-sg23
        run: |
          docker run --rm --entrypoint node "${IMAGE}:${GITHUB_SHA}" /app/openclaw.mjs --version

      - name: Publish SG 2.3 image
        env:
          IMAGE: ghcr.io/korzh260609-beep/garya-bot-sg23
        run: |
          docker push "${IMAGE}:${GITHUB_SHA}"
          docker push "${IMAGE}:dev"
