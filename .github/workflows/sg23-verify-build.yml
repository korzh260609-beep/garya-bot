name: Verify SG 2.3 clean OpenClaw build

on:
  push:
    branches:
      - dev/sg2.3-openclaw
    paths:
      - .github/workflows/sg23-verify-build.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-env
        with:
          install-deps: "true"
          frozen-lockfile: "true"
          cache-mode: "off"
      - name: Build OpenClaw
        run: pnpm build
