name: Smoke Human Meaning No Raw Keywords

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - feat/remove-human-meaning-keywords

jobs:
  smoke-human-meaning-no-raw-keywords:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run Human meaning no raw keywords smoke
        run: npm run smoke:human-meaning-no-raw-keywords
