name: Smoke Human Mode Source Question Contract

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - fix/human-mode-source-question-contract

jobs:
  smoke-human-mode-source-question-contract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run Human Mode source question contract smoke
        run: npm run smoke:human-mode-source-question-contract
