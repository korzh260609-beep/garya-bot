name: Smoke Human Mode

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/smokeHumanModeSkeletonImports.js"
      - "src/core/projectIntent/modes/human/**"
      - "package.json"
      - ".github/workflows/smoke-human-mode.yml"

jobs:
  smoke-human-mode:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run Human Mode smoke check
        run: npm run smoke:human-mode
