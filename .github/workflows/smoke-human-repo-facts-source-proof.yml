name: Smoke Human Repo Facts Source Proof

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - feat/human-repo-facts-source-proof

jobs:
  smoke-human-repo-facts-source-proof:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run Human repo facts source proof smoke
        run: npm run smoke:human-repo-facts-source-proof
