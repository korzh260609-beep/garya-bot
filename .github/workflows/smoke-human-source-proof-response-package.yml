name: Smoke Human Source Proof Response Package

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - feat/human-source-proof-response-package

jobs:
  smoke-human-source-proof-response-package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run Human source proof response package smoke
        run: npm run smoke:human-source-proof-response-package
