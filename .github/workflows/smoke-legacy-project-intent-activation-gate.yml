name: Smoke Legacy ProjectIntent Activation Gate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - feat/reduce-legacy-project-intent-influence

jobs:
  smoke-legacy-project-intent-activation-gate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run legacy projectIntent activation gate smoke
        run: npm run smoke:legacy-project-intent-activation-gate
