name: Smoke Living RepoStateAgent Provider Result

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - feat/living-repo-state-agent-result-adapter

jobs:
  smoke-living-repo-state-agent-provider-result:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run Living RepoStateAgent provider result smoke
        run: npm run smoke:living-repo-state-agent-provider-result
