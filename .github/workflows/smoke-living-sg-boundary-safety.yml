name: Smoke Living SG Boundary Safety

# Verifies Living SG boundary stays dry-run/read-only/disconnected and never executes tools or changes state.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/smokeLivingSGBoundarySafetyContract.js"
      - "src/core/living-sg/**"
      - "package.json"
      - ".github/workflows/smoke-living-sg-boundary-safety.yml"

jobs:
  smoke-living-sg-boundary-safety:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run Living SG boundary safety smoke check
        run: npm run smoke:living-sg-boundary-safety
