name: Smoke Living SG Core

# Verifies Living SG core behavior without connecting capabilities.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/smokeLivingSGCoreBehavior.js"
      - "src/core/behaviorCore.js"
      - "package.json"
      - ".github/workflows/smoke-living-sg-core.yml"

jobs:
  smoke-living-sg-core:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run Living SG core smoke check
        run: npm run smoke:living-sg-core
