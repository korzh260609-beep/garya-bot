name: Smoke Living SG Repo Read Planner Envelope Contract

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - sg-planner-envelope-01

jobs:
  smoke-living-sg-repo-read-planner-envelope-contract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run Living SG repo read planner envelope contract smoke
        run: npm run smoke:living-sg-repo-read-planner-envelope-contract
