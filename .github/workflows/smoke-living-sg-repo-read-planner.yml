name: Smoke Living SG Repo Read Planner

# Verifies Living SG repo-read planner is planning-only and does not read repo or prove facts.
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - sg-repo-read-planner-01
    paths:
      - "src/core/living-sg/LivingRepoReadRequestPlan.js"
      - "src/core/living-sg/LivingRepoSourceCapability.js"
      - "src/core/living-sg/LivingSourceProofBoundary.js"
      - "scripts/smokeLivingSGRepoReadRequestPlanner.js"
      - "package.json"
      - ".github/workflows/smoke-living-sg-repo-read-planner.yml"

jobs:
  smoke-living-sg-repo-read-planner:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run Living SG repo-read planner smoke check
        run: npm run smoke:living-sg-repo-read-planner
