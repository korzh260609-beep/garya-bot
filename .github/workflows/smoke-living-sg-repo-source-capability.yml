name: Smoke Living SG Repo Source Capability

# Verifies the Living SG repo source capability skeleton stays read-only and source-honest.
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - sg-repo-source-skeleton-01
    paths:
      - "src/core/living-sg/LivingRepoSourceCapability.js"
      - "scripts/smokeLivingSGRepoSourceCapabilitySkeleton.js"
      - "package.json"
      - ".github/workflows/smoke-living-sg-repo-source-capability.yml"

jobs:
  smoke-living-sg-repo-source-capability:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run Living SG repo source capability smoke check
        run: npm run smoke:living-sg-repo-source-capability
