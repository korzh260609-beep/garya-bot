name: Smoke Living SG Source Proof Envelope Input

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - sg-source-proof-envelope-input-01

jobs:
  smoke-living-sg-source-proof-envelope-input:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run Living SG source proof envelope input smoke
        run: npm run smoke:living-sg-source-proof-envelope-input
