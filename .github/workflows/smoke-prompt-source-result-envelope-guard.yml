name: Smoke Prompt Source Result Envelope Guard

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - sg-prompt-envelope-guard-01

jobs:
  smoke-prompt-source-result-envelope-guard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run prompt source result envelope guard smoke
        run: npm run smoke:prompt-source-result-envelope-guard
