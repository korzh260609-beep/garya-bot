name: Smoke Prompt Source Result System Message Wiring

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - sg-source-result-prompt-wiring-01

jobs:
  smoke-prompt-source-result-system-message-wiring:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run prompt source result system message wiring smoke
        run: npm run smoke:prompt-source-result-system-message-wiring
