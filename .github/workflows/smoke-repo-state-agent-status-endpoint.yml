name: Smoke RepoStateAgent Status Endpoint

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - test/repo-state-agent-status-endpoint-smoke

jobs:
  smoke-repo-state-agent-status-endpoint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run RepoStateAgent status endpoint smoke
        run: npm run smoke:repo-state-agent-status-endpoint
