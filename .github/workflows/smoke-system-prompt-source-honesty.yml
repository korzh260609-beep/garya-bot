name: Smoke System Prompt Source Honesty

# Verifies the final system prompt preserves source/tool honesty and does not simulate unavailable capabilities.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/smokeSystemPromptSourceHonesty.js"
      - "systemPrompt.js"
      - "src/core/behaviorCore.js"
      - "package.json"
      - ".github/workflows/smoke-system-prompt-source-honesty.yml"

jobs:
  smoke-system-prompt-source-honesty:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run system prompt source honesty smoke check
        run: npm run smoke:system-prompt-source-honesty
