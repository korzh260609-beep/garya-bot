services:
  - type: web
    name: garya-bot
    runtime: docker
    plan: 1c-2g
    branch: dev/sg2.3-openclaw
    autoDeploy: false
    dockerfilePath: ./Dockerfile.render
    dockerCommand: node openclaw.mjs gateway --allow-unconfigured --bind lan
    healthCheckPath: /healthz
    envVars:
      - key: OPENCLAW_STATE_DIR
        value: /data/.openclaw
      - key: OPENCLAW_WORKSPACE_DIR
        value: /data/workspace
    disk:
      name: disk
      mountPath: /data
      sizeGB: 1
