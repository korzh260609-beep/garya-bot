services:
  - type: web
    name: garya-bot-diagnostics
    runtime: node
    plan: free
    branch: dev/sg2.1-semantic
    buildCommand: npm ci
    startCommand: npm run start:diagnostics
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: SG_ENVIRONMENT
        value: production
      - key: SG_PROJECT_SCOPE
        value: sg2.1
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        sync: false
      - key: SG_MONARCH_GLOBAL_USER_ID
        sync: false
      - key: DIAGNOSTICS_ADMIN_TOKEN
        sync: false
      - key: RUN_DIAGNOSTICS_MIGRATIONS_ON_BOOT
        value: "false"
      - key: DIAGNOSTICS_GITHUB_REPOSITORY
        value: korzh260609-beep/garya-bot
      - key: DIAGNOSTICS_GITHUB_BRANCH
        value: dev/sg2.1-semantic
      - key: DIAGNOSTICS_SG_HEALTH_URL
        value: https://garya-bot.onrender.com/health
      - key: DIAGNOSTICS_IN_FLIGHT_GRACE_MS
        value: "300000"
