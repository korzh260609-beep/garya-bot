services:
  - type: web
    name: sg-2-1-web
    runtime: node
    branch: dev/sg2.1-semantic
    buildCommand: npm ci
    preDeployCommand: npm run migrate
    startCommand: npm run start:render
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    maxShutdownDelaySeconds: 30
    envVars:
      - key: NODE_ENV
        value: production
      - key: SG_ENVIRONMENT
        value: production
      - key: SG_REVISION
        value: block-17
      - key: SG_PROJECT_SCOPE
        value: sg2.1
      - key: SG_PERSISTENCE_MODE
        value: postgres
      - key: DATABASE_URL
        fromDatabase:
          name: sg-2-1-postgres
          property: connectionString
      - key: DATABASE_SSL
        value: "false"
      - key: TELEGRAM_REGISTER_WEBHOOK
        value: "true"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: SG_MONARCH_TELEGRAM_USER_ID
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: SG_AI_ENABLED
        value: "false"
      - key: SG_AI_EMERGENCY_DISABLED
        value: "false"

  - type: worker
    name: sg-2-1-worker
    runtime: node
    branch: dev/sg2.1-semantic
    buildCommand: npm ci
    preDeployCommand: npm run migrate
    startCommand: npm run start:worker
    autoDeployTrigger: checksPass
    maxShutdownDelaySeconds: 30
    envVars:
      - key: NODE_ENV
        value: production
      - key: SG_ENVIRONMENT
        value: production
      - key: SG_REVISION
        value: block-17
      - key: SG_PROJECT_SCOPE
        value: sg2.1
      - key: SG_PERSISTENCE_MODE
        value: postgres
      - key: DATABASE_URL
        fromDatabase:
          name: sg-2-1-postgres
          property: connectionString
      - key: DATABASE_SSL
        value: "false"


databases:
  - name: sg-2-1-postgres
    postgresMajorVersion: "16"
    databaseName: sg21
    user: sg21
    ipAllowList: []
