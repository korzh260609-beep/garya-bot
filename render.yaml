services:
  - type: web
    name: garya-bot
    runtime: docker
    plan: 1c-2g
    region: oregon
    repo: https://github.com/korzh260609-beep/garya-bot
    branch: dev/sg2.3-openclaw
    autoDeployTrigger: off
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    dockerCommand: /app/sg23-entrypoint.sh
    healthCheckPath: /healthz
    envVars:
      - key: GARYA_PILOT_TELEGRAM_BOT_TOKEN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENCLAW_GATEWAY_PORT
        sync: false
      - key: OPENCLAW_GATEWAY_TOKEN
        sync: false
      - key: OPENCLAW_STATE_DIR
        sync: false
      - key: OPENCLAW_WORKSPACE_DIR
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
    disk:
      name: disk
      mountPath: /data
      sizeGB: 1
